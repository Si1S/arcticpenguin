---
- name: Ensure wazuh-indexer user exists
  ansible.builtin.getent:
    database: passwd
    key: wazuh-indexer

- name: Ensure required directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - { path: /etc/wazuh-install, mode: "0750" }
    - { path: /var/ossec/etc/rules }
    - { path: /var/ossec/etc/shared/container }
    - { path: /var/ossec/etc/decoders }

    # FIX: wazuh-indexer doit pouvoir lire/traverser /etc/wazuh-indexer
    - { path: /etc/wazuh-indexer, owner: wazuh-indexer, group: wazuh-indexer, mode: "0750" }

    - { path: /etc/filebeat }
    - { path: /etc/wazuh-dashboard }
    - { path: /usr/share/wazuh-dashboard/data/wazuh/config }

- name: Deploy /etc/wazuh-install/config.yml
  ansible.builtin.template:
    src: wazuh-install-config.yml.j2
    dest: /etc/wazuh-install/config.yml
    owner: root
    group: root
    mode: "0640"

- name: Deploy Wazuh indexer opensearch.yml
  ansible.builtin.template:
    src: opensearch.yml.j2
    dest: /etc/wazuh-indexer/opensearch.yml
    owner: wazuh-indexer
    group: wazuh-indexer
    mode: "0640"
  notify: restart wazuh-indexer

- name: Deploy Filebeat filebeat.yml
  ansible.builtin.template:
    src: filebeat.yml.j2
    dest: /etc/filebeat/filebeat.yml
    owner: root
    group: root
    mode: "0640"
  notify: restart filebeat

- name: Deploy Wazuh manager ossec.conf
  ansible.builtin.template:
    src: ossec.conf.j2
    dest: /var/ossec/etc/ossec.conf
    owner: root
    group: wazuh
    mode: "0660"
  notify: restart wazuh-manager

- name: Deploy Wazuh dashboard opensearch_dashboards.yml
  ansible.builtin.template:
    src: opensearch_dashboards.yml.j2
    dest: /etc/wazuh-dashboard/opensearch_dashboards.yml
    owner: root
    group: wazuh-dashboard
    mode: "0640"
  notify: restart wazuh-dashboard

- name: Deploy Wazuh dashboard wazuh.yml
  ansible.builtin.template:
    src: wazuh.yml.j2
    dest: /usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
    owner: root
    group: wazuh-dashboard
    mode: "0640"
  notify: restart wazuh-dashboard

- name: Deploy local_rules.xml
  ansible.builtin.template:
    src: local_rules.xml.j2
    dest: /var/ossec/etc/rules/local_rules.xml
    owner: root
    group: wazuh
    mode: "0660"
  notify: restart wazuh-manager

- name: Deploy container group agent.conf
  ansible.builtin.template:
    src: agent.conf.j2
    dest: /var/ossec/etc/shared/container/agent.conf
    owner: root
    group: wazuh
    mode: "0660"
  notify: restart wazuh-manager

- name: Deploy docker decoders
  ansible.builtin.template:
    src: docker_decoders.xml.j2
    dest: /var/ossec/etc/decoders/docker_decoders.xml
    owner: root
    group: wazuh
    mode: "0660"
  notify: restart wazuh-manager

- name: Deploy docker rules
  ansible.builtin.template:
    src: docker_rules.xml.j2
    dest: /var/ossec/etc/rules/docker_rules.xml
    owner: root
    group: wazuh
    mode: "0660"
  notify: restart wazuh-manager

- name: Deploy rsyslog receiver config (pfSense)
  ansible.builtin.template:
    src: rsyslog-10-receiver.conf.j2
    dest: /etc/rsyslog.d/10-receiver.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart rsyslog
