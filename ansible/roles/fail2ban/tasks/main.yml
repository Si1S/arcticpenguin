---
- name: Temporary UFW outbound for package managers
  community.general.ufw:
    rule: allow
    port: "80,443"
    proto: tcp
    direction: out
    comment: "TEMP PACKAGES"
  register: ufw_packages_temp

- name: Download fail2ban .deb from GitHub release
  ansible.builtin.get_url:
    url: "{{ fail2ban_deb_url }}"
    dest: "{{ fail2ban_deb_path }}"
    mode: "0644"

- name: Install fail2ban from local .deb
  ansible.builtin.apt:
    deb: "{{ fail2ban_deb_path }}"
    state: present

- name: Remove temporary UFW packages rule
  community.general.ufw:
    rule: allow
    port: "80,443"
    proto: tcp
    direction: out
    delete: true
    comment: "TEMP PACKAGES"
  when: ufw_packages_temp.changed

- name: Deploy jail.local
  ansible.builtin.template:
    src: "jail.local.j2"
    dest: "/etc/fail2ban/jail.local"
    owner: root
    group: root
    mode: "0644"
  notify: restart fail2ban

- name: Deploy custom filters
  ansible.builtin.copy:
    src: "filter.d/{{ item }}"
    dest: "/etc/fail2ban/filter.d/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - web-scanner.conf
    - nginx-env.conf
    - nginx-4xx-probing.conf
  notify: restart fail2ban

- name: Deploy Cloudflare action (cloudflare-apiv4.conf)
  ansible.builtin.template:
    src: "action.d/cloudflare-apiv4.conf.j2"
    dest: "/etc/fail2ban/action.d/cloudflare-apiv4.conf"
    owner: root
    group: root
    mode: "0644"
  notify: restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
