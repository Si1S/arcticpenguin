---
- name: Remove sshd drop-in directory (single-config mode)
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: absent
  when: ssh_hardening_remove_dropin_dir | bool
  notify: Restart ssh

- name: Deploy hardened sshd_config
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
    validate: "sshd -t -f %s"
  notify: Restart ssh

- name: Ensure SSH service enabled/running
  ansible.builtin.service:
    name: "{{ ssh_hardening_sshd_service_name }}"
    enabled: "{{ ssh_hardening_service_enabled }}"
    state: "{{ ssh_hardening_service_state }}"
  when: ssh_hardening_manage_service | bool
