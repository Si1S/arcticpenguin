netplan_ip: 10.0.40.2
netplan_gateway: 10.0.40.1
netplan_interface: eth0
netplan_dns:
  - 10.0.20.2
  - 10.0.20.3
  - 9.9.9.9

extra_authorized_users:
 - cloudflared
 - node-exp
 - wazuh
 - webapp
 - postgres-app

ufw_rules:
  # Inbound rules
  - port: 22
    from:
      - "10.0.40.1"         # pfsense servers interface
      - "10.0.30.2"         # bas01

  - port: 9100              # node exporter
    from:
      - "10.0.20.6"         # mon01
      - "10.0.30.2"         # bas01

  - port: 9256              # process exporter
    from:
      - "10.0.20.6"         # mon01
      - "10.0.30.2"         # bas01

  - port: 8080              # arcticpenguin
    from:
      - "127.0.0.1"
      - "::1"

# Outbound rules
ufw_rules_outgoing:
  - port: 1514              # wazuh agents
    to:
      - "10.0.20.5"         # waz01

  - port: 1515              # wazuh enrollment
    to:
      - "10.0.20.5"         # waz01

  - port: 7844              # Cloudflare Tunnel
    proto: udp
    to: "{{ cloudflare_tunnel_ipv4_ranges }}"

  - port: 80
    proto: tcp
    to:
      - "172.20.0.10"       # nginx container

  - port: 53
    proto: udp
    to:
      - "10.0.20.2"         # mad01
      - "10.0.20.3"         # mad02

  - port: 443
    to: "{{ github_web_ipv4_ranges | union(cloudflare_api_ipv4_ranges) | list }}"

ufw_rules_outgoing_ipv6:
  - port: 7844              # Cloudflare Tunnel
    proto: udp
    to: "{{ cloudflare_tunnel_ipv6_ranges }}"

  - port: 443
    to: "{{ github_web_ipv6_ranges | union(cloudflare_api_ipv6_ranges) | list }}"

ufw_outgoing_policy: deny

cloudflared_tunnel_token: "{{ vault_cloudflared_tunnel_token }}"
cloudflared_hostname: arcticpenguin.org
cloudflared_service_url: http://localhost:8080

apt_packages:
  - curl
  - jq

fail2ban_gh_version: "1.1.0"
fail2ban_deb_url: "https://github.com/fail2ban/fail2ban/releases/download/{{ fail2ban_gh_version }}/fail2ban_{{ fail2ban_gh_version }}-1.upstream1_all.deb"
fail2ban_deb_path: "/tmp/fail2ban_{{ fail2ban_gh_version }}.deb"
fail2ban_jail_local_path: "/etc/fail2ban/jail.local"
fail2ban_logpath: "/opt/webapp/logs/nginx/access.log"

fail2ban_cf_action: "cloudflare-apiv4"
fail2ban_cf_token: "{{ vault_fail2ban_cf_token }}"

wazuh_enable_docker_listener: true

wazuh_extra_localfiles:
  - log_format: "syslog"
    location: "/srv/logs/nginx/access.log"
  - log_format: "syslog"
    location: "/srv/logs/nginx/error.log"

wazuh_agent_client_buffer_queue_size: "20000"
wazuh_agent_client_buffer_events_per_second: "800"
